name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
  push:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: careeros
          POSTGRES_PASSWORD: careeros
          POSTGRES_DB: careeros
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careeros"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://careeros:careeros@localhost:5432/careeros
      ENV: test
      CLERK_ISSUER: https://example.clerk.accounts.dev
      CLERK_JWKS_URL: https://example.clerk.accounts.dev/.well-known/jwks.json
      CORS_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - run: uv sync --directory backend --extra dev

      - run: uv run --directory backend ruff check .

      - run: uv run --directory backend ruff format --check .

      - run: uv run --directory backend mypy src

      # Apply migrations so DB-backed tests (e.g. /me upsert) have a schema.
      - run: uv run --directory backend alembic upgrade head

      - run: uv run --directory backend pytest -q
